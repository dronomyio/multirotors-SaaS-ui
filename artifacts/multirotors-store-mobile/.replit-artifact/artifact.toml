kind = "mobile"
previewPath = "/multirotors-store-mobile/"
title = "multirotors.store mobile"
description = "A React Native / Expo mobile companion for the multirotors.store AI drone consultant. Lets customers chat with the AI drone expert, receive itemized pro-forma invoices, and tap through to checkout — all from their phone."
version = "1.0.0"
id = "artifacts/multirotors-store-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/multirotors-store-mobile/" ]
localPort = 20436

[services.development]
run = "pnpm --filter @workspace/multirotors-store-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/multirotors-store-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/multirotors-store-mobile", "run", "serve" ]

[services.env]
PORT = "20436"
BASE_PATH = "/multirotors-store-mobile/"
