kind = "web"
previewPath = "/"
title = "multirotors.store"
description = "A high-fidelity landing page for multirotors.store — an autonomous drone and robotics reseller & integrator. Showcases enterprise drones, quadruped robots, AMR platforms, development platforms, and sensors/payloads with a dark aerospace aesthetic."
version = "1.0.0"
id = "artifacts/multirotors-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21052

[services.development]
run = "pnpm --filter @workspace/multirotors-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/multirotors-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/multirotors-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21052"
BASE_PATH = "/"
