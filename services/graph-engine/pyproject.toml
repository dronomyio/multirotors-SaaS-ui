[project]
name = "graph-engine"
version = "0.1.0"
description = "Neo4j engineering graph, MySQL catalog cache, and Temporal workers for multirotors.store"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.31.0",
    "pydantic>=2.13.0",
    "neo4j>=6.2.0",
    "sqlalchemy>=2.0.40",
    "pymysql>=1.1.1",
    "httpx>=0.28.0",
    "structlog>=25.1.0",
    "qdrant-client>=1.13.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
graph-worker = "graph_engine.temporal.worker:main"
graph-provision = "graph_engine.temporal.provision:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["graph_engine"]
