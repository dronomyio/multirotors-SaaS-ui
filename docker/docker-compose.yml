# Full local stack.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Ports:
#   7474  Neo4j Browser      (neo4j / multirotors_dev)
#   6333  Qdrant REST        6334 gRPC
#   3306  MySQL              (root / multirotors_dev)
#   7233  Temporal gRPC      8080 Temporal UI
#   6006  Phoenix (traces)
#   5000  API server
#
# Everything has a healthcheck and the dependency graph is expressed with
# `condition: service_healthy`. Without that, the worker races Neo4j on a cold
# boot and dies before the database finishes its first startup — which looks
# like a code bug and is not one.

name: multirotors

x-graph-env: &graph-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-multirotors_dev}
  CATALOG_CACHE_URL: mysql+pymysql://root:${MYSQL_PASSWORD:-multirotors_dev}@mysql:3306/multirotors_cache
  QDRANT_URL: http://qdrant:6333
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-multirotors}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
  OTEL_SERVICE_NAME: multirotors-graph-engine
  SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-multirotors.store}
  ENVIRONMENT: development
  LOG_LEVEL: INFO

services:
  # ── Stores ────────────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-multirotors_dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data
      - ./neo4j/init:/init:ro
    healthcheck:
      # `wait-for-neo4j` is not a thing; querying is the only honest readiness probe.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-multirotors_dev} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  mysql:
    image: mysql:8.4
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-multirotors_dev}
      MYSQL_DATABASE: multirotors_cache
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-multirotors_dev}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      # The image is distroless — no curl, no wget. Qdrant ships its own probe.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Temporal ──────────────────────────────────────────────────────────────

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes: [temporal-pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports: ["7233:7233"]
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]

  # ── Observability ─────────────────────────────────────────────────────────

  phoenix:
    # Arize Phoenix: the self-hosted OTLP collector and trace UI. Point
    # OTEL_EXPORTER_OTLP_ENDPOINT at Arize AX instead for the cloud product —
    # same protocol, different headers.
    image: arizephoenix/phoenix:version-8.26.0
    ports: ["6006:6006", "4317:4317"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes: [phoenix-data:/mnt/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6006/healthz')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Application ───────────────────────────────────────────────────────────

  graph-provision:
    # One-shot. Creates the namespace, search attributes, and catalog-sync
    # schedule, then exits 0. Idempotent, so it runs on every `up`.
    build:
      context: ..
      dockerfile: docker/Dockerfile.graph-engine
    depends_on:
      temporal: { condition: service_healthy }
    environment: *graph-env
    command: ["graph-provision"]
    restart: "no"

  graph-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.graph-engine
    depends_on:
      neo4j: { condition: service_healthy }
      mysql: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      temporal: { condition: service_healthy }
      graph-provision: { condition: service_completed_successfully }
    environment: *graph-env
    command: ["graph-worker"]
    restart: unless-stopped
    deploy:
      replicas: ${GRAPH_WORKER_REPLICAS:-1}

  api-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-server
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      NODE_ENV: development
      PORT: "5000"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-multirotors}
      DATABASE_URL: ${DATABASE_URL:-}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-multirotors.store}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
    ports: ["5000:5000"]
    restart: unless-stopped

volumes:
  neo4j-data:
  mysql-data:
  qdrant-data:
  temporal-pg-data:
  phoenix-data:
